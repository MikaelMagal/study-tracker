services:
  app:
    build: .
    container_name: study_tracker_app
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: study_tracker_db
    restart: always
    environment:
      POSTGRES_DB: study_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"